[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-reference"
version = "0.1.0"
description = "Local-first, evidence-grounded retrieval architecture reference"
requires-python = ">=3.10"

[project.optional-dependencies]
azure = ["azure-identity>=1.17,<2", "azure-keyvault-secrets>=4.8,<5"]
postgres = ["psycopg[binary,pool]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]
